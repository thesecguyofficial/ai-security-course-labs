# OPTIONAL guided build. One Ollama pod on the tainted GPU node, reachable only inside the cluster (ClusterIP).
apiVersion: v1
kind: Namespace
metadata:
  name: inference
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: inference
spec:
  replicas: 1
  selector:
    matchLabels: {app: ollama}
  template:
    metadata:
      labels: {app: ollama}
    spec:
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: ollama
          image: ollama/ollama:0.40.11
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0"          # inside the pod; the Service below is ClusterIP, so nothing outside reaches it
          ports:
            - containerPort: 11434
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            limits:
              nvidia.com/gpu: 1
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: inference
spec:
  type: ClusterIP
  selector: {app: ollama}
  ports:
    - port: 11434
      targetPort: 11434
