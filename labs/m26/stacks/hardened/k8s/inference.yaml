# TSG Inference on EKS, hardened. Lab file only: read by scan.py, never applied.
apiVersion: v1
kind: Namespace
metadata:
  name: inference
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vllm
  namespace: inference   # gets its own IAM role through an EKS Pod Identity association
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: inference
spec:
  replicas: 1
  selector:
    matchLabels: {app: vllm}
  template:
    metadata:
      labels: {app: vllm}
    spec:
      serviceAccountName: vllm
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.32.0
          args: ["--model", "/models/approved-model", "--host", "0.0.0.0", "--api-key", "$(VLLM_API_KEY)"]
          env:
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef: {name: vllm-api-key, key: key}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
          resources:
            limits:
              nvidia.com/gpu: 1
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: inference
spec:
  type: ClusterIP
  selector: {app: vllm}
  ports:
    - port: 8000
      targetPort: 8000
---
# Default deny: nothing in or out of the namespace unless a later policy allows it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: inference
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
# Only the gateway may call vLLM, and vLLM may only answer DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vllm-from-gateway
  namespace: inference
spec:
  podSelector:
    matchLabels: {app: vllm}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: gateway}
      ports:
        - {protocol: TCP, port: 8000}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports:
        - {protocol: UDP, port: 53}
