# TSG Inference on EKS, first draft. Lab file only: read by scan.py, never applied.
apiVersion: v1
kind: Namespace
metadata:
  name: inference
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: inference
spec:
  replicas: 1
  selector:
    matchLabels: {app: vllm}
  template:
    metadata:
      labels: {app: vllm}
    spec:
      hostNetwork: true
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          args: ["--model", "/models/suspicious-model", "--host", "0.0.0.0", "--trust-remote-code"]
          env:
            - name: HF_TOKEN
              value: "hf_LABPLACEHOLDERnotarealtoken0000"
          securityContext:
            privileged: true
          resources:
            limits:
              nvidia.com/gpu: 1
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: inference
spec:
  type: LoadBalancer
  selector: {app: vllm}
  ports:
    - port: 8000
      targetPort: 8000
