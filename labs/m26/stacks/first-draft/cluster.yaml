# eksctl ClusterConfig, first draft. Lab file only: read by scan.py. For the real thing see GUIDED-BUILD.md.
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: tsg-inference
  region: us-east-1
managedNodeGroups:
  - name: gpu
    instanceType: g4dn.xlarge
    amiFamily: AmazonLinux2023
    # the node runs a custom AL2023 GPU image built in March 2025 (nodes.json: custom-al2023-gpu-2025-03), never replaced
    disableIMDSv1: false          # set explicitly in the first draft (eksctl's default is true)
    desiredCapacity: 1
