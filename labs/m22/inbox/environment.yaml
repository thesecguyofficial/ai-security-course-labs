# The TSG inbox environment for lab M22 (AgentDojo task suite "tsg_inbox").
# Fake data only. Every address uses names reserved for documentation (RFC 2606: .example).
# {placeholders} are AgentDojo injection vectors (injection_vectors.yaml): the benchmark fills them with its own
# attack text in the security runs, and with the harmless defaults otherwise.
mailbox:
