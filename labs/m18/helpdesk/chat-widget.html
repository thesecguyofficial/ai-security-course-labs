<!doctype html>
<!-- TSG Helpdesk chat widget (lab copy). The text inside id="greeting" is the first message every
     customer sees. Lesson 18.2 and Step 6 of the lab: does it tell people they are talking to an AI? -->
<html lang="en">
<head><meta charset="utf-8"><title>TSG Shop support</title></head>
<body>
  <section id="chat" aria-label="Support chat">
    <p id="greeting">Hello, welcome to TSG Shop support. I can help with orders, deliveries and refunds. What do you need?</p>
    <form><label for="msg">Your message</label> <input id="msg" name="msg"> <button>Send</button></form>
  </section>
</body>
</html>
