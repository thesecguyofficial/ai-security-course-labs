name: house-voice
on: [push, pull_request]
permissions:
  contents: read
jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/style/style_check.py README.md labs docs
      - name: copy-paste check (shell blocks hold only commands)
        run: python3 tools/style/codeblock_check.py . && python3 tools/style/codeblock_check.py --self-test
