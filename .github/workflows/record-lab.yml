name: record-lab
# Records a REAL terminal session for a course lab video on a fresh GitHub-hosted Ubuntu machine.
# A real user "thesecguy" on host "lab" runs every command; the .cast file is the exact terminal
# output with timing, and this public run log shows the whole session as plain text.
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "scenario name in recordings/scenarios (without .json)"
        required: true
  push:
    branches: [lab-recorder]
    paths: ["recordings/**", ".github/workflows/record-lab.yml"]
permissions:
  contents: write   # only to push the finished recording to the lab-recordings branch

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      SCENARIO: ${{ inputs.scenario || 'm00-0.6-linux' }}
    steps:
      - uses: actions/checkout@v4
      - name: recorder tools (off camera)
        run: python3 -m pip install --user --break-system-packages asciinema==2.4.0 pexpect==4.9.0
      - name: prepare a clean machine (off camera)
        run: |
          mkdir -p "out/$SCENARIO"
          sudo bash recordings/prepare.sh "recordings/scenarios/$SCENARIO.json" 2>&1 | tee "out/$SCENARIO/setup.log"; exit ${PIPESTATUS[0]}
      - name: record (real session)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          python3 recordings/record.py "recordings/scenarios/$SCENARIO.json" "out/$SCENARIO"
      - name: proof (fingerprints + the full session as text)
        if: always()
        run: |
          cd "out/$SCENARIO" && sha256sum * && echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" | tee run.txt
          echo "----- transcript -----"; cat transcript.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rec-${{ env.SCENARIO }}
          path: out/${{ env.SCENARIO }}
          retention-days: 90
      - name: publish the recording to the lab-recordings branch
        if: always()
        run: |
          dest="$SCENARIO"; [ "${{ job.status }}" = "success" ] || dest="$SCENARIO-failed"
          git config user.name "The Sec Guy"; git config user.email "hello@thesecguy.com"
          git fetch origin lab-recordings || true
          if git rev-parse -q --verify origin/lab-recordings; then git switch -c pub origin/lab-recordings; else git switch --orphan pub; git rm -rq --cached . 2>/dev/null || true; fi
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name out ! -name recordings-pub -exec rm -rf {} +
          rm -rf "$dest" && mkdir -p "$dest" && cp out/$SCENARIO/* "$dest/"
          git add -A "$dest" && git commit -qm "Recording $dest (run $GITHUB_RUN_ID)" && git push -q origin pub:lab-recordings
